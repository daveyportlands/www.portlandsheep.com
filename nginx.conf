##
## Portland Sheep Breeders' Group — Nginx configuration
##
## Prerequisites:
##   1. Build the Astro site:  npm run build  (output → dist/)
##   2. Generate the .htpasswd file for the Members Area:
##        sudo htpasswd -c /etc/nginx/.htpasswd members
##      (repeat without -c to add more users)
##   3. Obtain TLS certificates (e.g. via Certbot / Let's Encrypt)
##

server {
    listen 80;
    listen [::]:80;
    server_name portlandsheep.com www.portlandsheep.com;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portlandsheep.com www.portlandsheep.com;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/portlandsheep.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portlandsheep.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Document root (Astro static build output) ─────────────────────────
    root /var/www/portlandsheep/dist;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"            always;
    add_header X-Content-Type-Options     "nosniff"               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' https://unpkg.com https://identity.netlify.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.netlify.com https://identity.netlify.com;"
        always;

    # ── Redirect non-www → www ────────────────────────────────────────────
    if ($host = portlandsheep.com) {
        return 301 https://www.portlandsheep.com$request_uri;
    }

    # ── Decap CMS admin (/admin/) — protect with Basic Auth ──────────────
    # Alternatively, protect this with Netlify Identity (configured in config.yml).
    # Comment this block out if you use Netlify Identity exclusively.
    location /admin/ {
        auth_basic           "CMS — Authorised Users Only";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /admin/index.html =404;
    }

    # ── Members area — password protected ────────────────────────────────
    location /members/ {
        auth_basic           "Portland Sheep — Members Only";
        auth_basic_user_file /etc/nginx/.htpasswd.members;
        try_files $uri $uri/ /members/index.html =404;
    }

    # ── Static assets — long cache ────────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|webp|avif|jpg|jpeg|png|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Astro static routing (SPA-style fallback for nested routes) ────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ── Custom error pages ────────────────────────────────────────────────
    error_page 404 /404.html;
    error_page 401 /401.html;
    error_page 500 502 503 504 /50x.html;

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Block access to hidden files ──────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
